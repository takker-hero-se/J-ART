<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="J-ART">
  <title>J-ART</title>
  <!-- Quiet Forensics の配色: 紺 #082A41 の地 / 白の線 / シアン #2BC1FF のアクセント -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#082A41"/>

  <!-- 盾: 防御 / 耐性 -->
  <path d="M32 9 L50 15 V31 C50 42.6 42 49.8 32 54 C22 49.8 14 42.6 14 31 V15 Z"
        fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>

  <!-- 照準レティクル: 敵対的レッドチーム -->
  <circle cx="32" cy="30.5" r="10" fill="none" stroke="#2BC1FF" stroke-width="2.6"/>
  <g stroke="#2BC1FF" stroke-width="2.6" stroke-linecap="round">
    <line x1="32" y1="16.5" x2="32" y2="21"/>
    <line x1="32" y1="40" x2="32" y2="44.5"/>
    <line x1="18" y1="30.5" x2="22.5" y2="30.5"/>
    <line x1="41.5" y1="30.5" x2="46" y2="30.5"/>
  </g>

  <!-- 中心: 日の丸 ＝ ブルズアイ（日本特化 × 標的） -->
  <circle cx="32" cy="30.5" r="4.2" fill="#E5484D"/>
</svg>
