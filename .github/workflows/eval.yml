name: J-ART (Japanese Adversarial Red-Team framework) - Eval & Deploy

# 定期実行(cron) + 手動実行(workflow_dispatch) の両対応
on:
  schedule:
    # 毎週月曜 JST 03:00 (UTC 日曜 18:00) に実行
    - cron: "0 18 * * 0"
  workflow_dispatch:
    inputs:
      force_mock:
        description: "APIキーを使わず決定論シミュレーション(MOCK)で実行する"
        type: boolean
        default: false
      trials:
        description: "1セルあたりの試行回数 N（信頼区間を締めたい本番は 5 など）"
        type: string
        default: "1"
  push:
    branches: [ main ]
    paths:
      - "config.yaml"
      - "run_assessment.py"
      - "generate_site.py"
      - "tests/**"
      - ".github/workflows/eval.yml"

# GitHub Pages へのデプロイに必要な権限
permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行は1つに集約（古いデプロイは中断）
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    # contents: write は、定期・手動の LIVE 結果を experiments/live_latest.json に保存するため
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests (guardrail normalization)
        # 難読化解除ガードレールの回帰テスト。API不要・決定論。失敗時はジョブを停止。
        run: |
          python tests/test_guardrails.py

      - name: Publish results
        env:
          # 機密情報は GitHub Secrets から安全に読み込む（cron/手動のLIVE実行でのみ使用）
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # 手動実行で force_mock=true なら強制MOCK（cron/手動の fresh 実行に作用）。
          JART_FORCE_MOCK: ${{ github.event.inputs.force_mock == 'true' && '1' || '' }}
          # 1セルあたり試行回数（手動実行で 5 等を指定可。既定は 1）。
          JART_TRIALS: ${{ github.event.inputs.trials || '1' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # 公開データの方針（クレジット二重消費・MOCK混在を避ける）:
          #   - push  … 課金せず、直近の LIVE 結果 experiments/live_latest.json を公開
          #             （無ければ論文用の experiments/var_run.json）。
          #   - cron / 手動 … 新規に LIVE 評価を実行して結果を更新。
          if [ "$EVENT_NAME" = "push" ]; then
            # 計測したものはすべて公開する: 直近の定期/手動 LIVE 結果（全構成）を優先し、
            # まだ無いときだけ論文用キャンペーン（21構成）を公開する。
            if [ -f experiments/live_latest.json ]; then
              echo "[push] Publishing the latest LIVE run (experiments/live_latest.json); no API calls."
              cp experiments/live_latest.json results.json
            else
              echo "[push] Publishing the committed LIVE artifact (experiments/var_run.json); no API calls."
              cp experiments/var_run.json results.json
            fi
          else
            echo "[$EVENT_NAME] Running a fresh assessment (LIVE unless force_mock)."
            python run_assessment.py --config config.yaml --out results.json
          fi

      - name: Keep the LIVE results in the repository
        # 次の push で古い結果に戻らないよう、定期・手動の LIVE 結果を保存する。
        # MOCK 強制の手動実行は保存しない。GITHUB_TOKEN のコミットは新しい実行を起こさない。
        if: ${{ github.event_name != 'push' && github.event.inputs.force_mock != 'true' }}
        run: |
          cp results.json experiments/live_latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/live_latest.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "results: LIVE run $(date -u +%F) (${{ github.event_name }})"
          git push origin HEAD:main || (git pull --rebase origin main && git push origin HEAD:main)

      - name: Generate static site
        env:
          # GoatCounter のサイトコード。Actions の Variables に JART_GOATCOUNTER_CODE を
          # 設定すると公開サイトへ解析タグが入る。未設定なら自動的にタグなしで生成される。
          JART_GOATCOUNTER_CODE: ${{ vars.JART_GOATCOUNTER_CODE }}
        run: |
          python generate_site.py --results results.json --outdir site

      # GitHub Pages を明示的に有効化・再構成する（Pages バックエンドの状態異常対策）。
      # enablement: true で未設定/不整合でも API 経由で Pages を立て直す。
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Archive raw results
        uses: actions/upload-artifact@v7
        with:
          name: results-json
          path: results.json
          retention-days: 30

  deploy:
    needs: evaluate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # 週次(cron)・手動実行のみ対象。push（既存LIVE成果物の再公開）では投稿しない。
      # X_API_KEY 等の Secrets が未設定なら post_tweet.py 側でスキップされる。
      - name: Checkout
        if: ${{ github.event_name != 'push' }}
        uses: actions/checkout@v6

      - name: Download results artifact
        if: ${{ github.event_name != 'push' }}
        uses: actions/download-artifact@v6
        with:
          name: results-json

      - name: Set up Python
        if: ${{ github.event_name != 'push' }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Post weekly summary to X
        if: ${{ github.event_name != 'push' }}
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        # 投稿は共通の qf_common/qf_x.py（標準ライブラリのみ）。追加の pip install は不要。
        run: python post_tweet.py --results results.json

  # クレジット切れの検知（定期・手動実行のみ）。失敗すると GitHub から失敗通知メールが届く。
  # 公開（deploy）とは独立したジョブなので、ここが失敗してもサイトの更新は止まらない。
  credits:
    needs: evaluate
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download results artifact
        uses: actions/download-artifact@v6
        with:
          name: results-json

      - name: Check API credits
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 scripts/check_credits.py --results results.json
