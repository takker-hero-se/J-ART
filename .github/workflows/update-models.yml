name: J-ART - add newly released models

# 毎週、新しく公開されたモデルを評価対象（config.yaml）に自動で追加する。
# 月曜 JST 03:00 の定期評価（eval.yml）の前日に走り、その評価で新モデルが測られる。
# 選定ルール・上限は scripts/update_models.py のコメントを参照（1回最大3モデル・1提供元1つ・単価上限）。
on:
  schedule:
    # 毎週日曜 JST 01:00（UTC 土曜 16:00）
    - cron: "0 16 * * 6"
  workflow_dispatch:
    inputs:
      max_new:
        description: "1回に追加する最大モデル数"
        type: string
        default: "3"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Add new models to config.yaml
        id: update
        env:
          JART_MAX_NEW_MODELS: ${{ github.event.inputs.max_new || '3' }}
        run: python scripts/update_models.py

      - name: Test (config still valid, MOCK run of every target)
        if: steps.update.outputs.added != ''
        env:
          JART_FORCE_MOCK: "1"
        run: |
          python -m pytest -q tests
          python run_assessment.py --config config.yaml --out /tmp/mock.json > /dev/null

      - name: Commit
        if: steps.update.outputs.added != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.yaml
          git commit -m "eval: auto-add newly released models (${{ steps.update.outputs.added }})"
          git push origin HEAD:main || (git pull --rebase origin main && git push origin HEAD:main)
